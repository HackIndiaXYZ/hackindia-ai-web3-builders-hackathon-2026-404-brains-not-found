{% extends 'base.html' %}

{% block head_extra %}
<style>
.login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}
.login-card {
    width: 100%;
    max-width: 400px;
    border-top: 2px solid var(--accent);
    position: relative;
    padding: 2.5rem 2rem;
}
.login-header {
    text-align: center;
    margin-bottom: 2rem;
}
.user-icon {
    width: 40px;
    height: 40px;
    color: var(--accent);
    margin: 0 auto 1rem auto;
    display: block;
}
.error-box {
    border: 1px solid var(--danger);
    background: rgba(244, 63, 94, 0.1);
    color: var(--danger);
    padding: 0.75rem;
    border-radius: 6px;
    margin-bottom: 1.5rem;
    font-size: 0.875rem;
    text-align: center;
}
.form-group {
    margin-bottom: 1.5rem;
}
.links-row {
    display: flex;
    justify-content: space-between;
    margin-top: 1.5rem;
    font-size: 0.875rem;
}
.links-row a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s;
}
.links-row a:hover {
    color: var(--text);
}
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="glass-card login-card anim-fade-up">
        <div class="login-header">
            <svg class="user-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <h2 class="text-accent" style="margin: 0 0 0.5rem 0; font-size: 1.5rem; font-weight: 600;">Citizen Services Portal</h2>
            <div class="text-muted text-xs" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">{{ organization }}</div>
        </div>

        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/citizen/login">
            <div class="form-group">
                <label class="input-label" for="username">Vehicle Owner ID</label>
                <input type="text" id="username" name="username" class="input input-mono w-full" style="width: 100%; box-sizing: border-box;" required>
            </div>
            
            <div class="form-group">
                <label class="input-label" for="password">Portal Access Key</label>
                <input type="password" id="password" name="password" class="input input-mono w-full" style="width: 100%; box-sizing: border-box;" required>
            </div>

            <button type="submit" class="btn btn-primary w-full" style="width: 100%; box-sizing: border-box; justify-content: center;">Access Portal</button>
        </form>

        <div class="links-row">
            <a href="/">← Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
