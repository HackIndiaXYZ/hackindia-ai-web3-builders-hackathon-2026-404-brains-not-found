{% extends 'base.html' %}

{% block head_extra %}
<style>
.login-wrapper {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
}
.login-card {
    width: 100%;
    max-width: 400px;
    border-top: 2px solid var(--accent);
    position: relative;
    padding: 2.5rem 2rem;
}
.login-header {
    text-align: center;
    margin-bottom: 2rem;
}
.shield-icon {
    width: 40px;
    height: 40px;
    color: var(--accent);
    margin: 0 auto 1rem auto;
    display: block;
}
.role-tabs {
    display: flex;
    gap: 0.25rem;
    background: var(--surface);
    padding: 0.25rem;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 1.5rem;
}
.role-tab {
    flex: 1;
    padding: 0.5rem;
    text-align: center;
    font-size: 0.875rem;
    cursor: pointer;
    border-radius: 4px;
    color: var(--text-muted);
    transition: all 0.2s ease;
}
.role-tab.active {
    background: var(--accent);
    color: #fff;
    font-weight: 500;
}
.error-box {
    border: 1px solid var(--danger);
    background: rgba(244, 63, 94, 0.1);
    color: var(--danger);
    padding: 0.75rem;
    border-radius: 6px;
    margin-bottom: 1.5rem;
    font-size: 0.875rem;
    text-align: center;
}
.form-group {
    margin-bottom: 1.5rem;
}
.links-row {
    display: flex;
    justify-content: space-between;
    margin-top: 1.5rem;
    font-size: 0.875rem;
}
.links-row a {
    color: var(--text-secondary);
    text-decoration: none;
    transition: color 0.2s;
}
.links-row a:hover {
    color: var(--text);
}
</style>
{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="glass-card login-card anim-fade-up">
        <div class="login-header">
            <svg class="shield-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            <h2 class="text-accent" style="margin: 0 0 0.5rem 0; font-size: 1.5rem; font-weight: 600;">Command Center</h2>
            <div class="text-muted text-xs" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">{{ organization }}</div>
        </div>

        {% if error %}
        <div class="error-box">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="hidden" name="role" id="role-input" value="admin">
            
            <div class="role-tabs">
                <div class="role-tab active" data-role="admin">Admin</div>
                <div class="role-tab" data-role="inspector">Inspector</div>
                <div class="role-tab" data-role="superintendent">Superintendent</div>
            </div>

            <div class="form-group">
                <label class="input-label" for="password">Authentication Key</label>
                <input type="password" id="password" name="password" class="input input-mono w-full" style="width: 100%; box-sizing: border-box;" required>
            </div>

            <button type="submit" class="btn btn-primary w-full" style="width: 100%; box-sizing: border-box; justify-content: center;">Authenticate</button>
        </form>

        <div class="links-row">
            <a href="/">← Back to Home</a>
            <a href="/citizen/login">Citizen Portal →</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const tabs = document.querySelectorAll('.role-tab');
        const roleInput = document.getElementById('role-input');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                roleInput.value = tab.dataset.role;
            });
        });
    });
</script>
{% endblock %}
