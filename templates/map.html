<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }} — Geolocation Hotspot Map & Trajectory</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css" />
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .top-nav {
      height: 60px;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 1000;
    }

    .sidebar {
      position: absolute;
      left: 16px;
      top: 76px;
      bottom: 16px;
      width: 340px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      overflow-y: auto;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (max-width: 768px) {
      .sidebar {
        left: 0; right: 0; top: auto; bottom: 0;
        width: 100%; height: 320px;
        border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      }
      #map { left: 0; top: 60px; bottom: 320px; }
    }

    #map {
      position: absolute;
      top: 60px;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
    }

    .leaflet-popup-content-wrapper {
      background: var(--bg-surface) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-md) !important;
    }
    .leaflet-popup-tip {
      background: var(--bg-surface) !important;
    }
    .leaflet-container {
      background: var(--bg) !important;
    }

    .blackspot-card {
      background: var(--bg);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.25s var(--ease);
    }
    .blackspot-card:hover {
      background: var(--bg-hover);
      border-color: var(--accent);
    }
  </style>
</head>
<body class="map-shell">

  <!-- Topbar -->
  <header class="top-nav">
    <div style="display:flex; align-items:center; gap:12px;">
      <i class="ph ph-map-trifold" style="font-size:1.6rem; color:var(--accent);"></i>
      <div>
        <div style="font-weight:800; font-size:1.15rem; letter-spacing:-0.01em; color:var(--text);">{{ app_name }} <span style="color:var(--accent);">GEOLOCATION INTELLIGENCE</span></div>
        <div class="text-xs text-muted" style="font-weight:600;">Spatial GIS Engine · Real-time Blackspot & Sighting Mesh</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="badge badge-blue text-mono">
        <span class="pulse-dot"></span> SATELLITE SENSORS LIVE
      </div>
      <a href="/" class="btn btn-secondary btn-sm">← Command Centre</a>
      <a href="/intelligence" class="btn btn-secondary btn-sm">Operations Grid</a>
    </div>
  </header>

  <!-- Sidebar -->
  <div class="sidebar">
    <div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
        <h3 class="text-sm" style="text-transform:uppercase; letter-spacing:0.06em; margin:0; color:var(--text);">Vehicle Trajectory</h3>
        <span class="badge badge-blue" style="font-size:0.65rem;">GIS TRACE</span>
      </div>
      <div style="display:flex; gap:8px;">
        <input type="text" id="searchPlate" placeholder="Plate (e.g. KA03MX4521)" style="flex:1; text-align:left; font-size:0.82rem; text-transform:uppercase; font-family:var(--font-mono);">
        <button class="btn btn-primary btn-sm" onclick="searchTrajectory()">Trace</button>
      </div>
    </div>

    <hr>

    <div>
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
        <h3 class="text-sm" style="text-transform:uppercase; letter-spacing:0.06em; margin:0; color:var(--text);">Hazardous Blackspots</h3>
        <span class="badge badge-red" style="font-size:0.65rem;">HIGH PRIORITY</span>
      </div>
      <div id="blackspots-sidebar" style="display:flex; flex-direction:column; gap:10px;">
        <!-- Dynamic blackspots list -->
      </div>
    </div>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <script>
    const map = L.map('map', {
      zoomControl: true
    }).setView([12.9716, 77.5946], 12);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://carto.com/">CARTO</a> | TrafficGuard Pro',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    let trajectoryLayer = null;

    function loadBlackspots() {
      fetch('/api/blackspots').then(r => r.json()).then(d => {
        const side = document.getElementById('blackspots-sidebar');
        side.innerHTML = (d.blackspots || []).map(b => `
          <div class="blackspot-card" style="border-left: 4px solid ${b.risk_score > 80 ? 'var(--error)' : 'var(--warning)'};" onclick="map.flyTo([${b.location.lat}, ${b.location.lng}], 15, { animate: true, duration: 1.5 })">
            <div style="font-weight:700; font-size:0.84rem; color:var(--text);">${b.name}</div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px;">
              <span class="badge ${b.risk_score > 80 ? 'badge-red' : 'badge-yellow'}" style="font-size:0.68rem;">Risk: ${b.risk_score}/100</span>
              <span class="text-xs text-dim text-mono">Peak: ${b.peak_risk_time}</span>
            </div>
          </div>
        `).join('');

        (d.blackspots || []).forEach(b => {
          const color = b.risk_score > 80 ? '#8b5a4a' : '#956E2F';
          L.circleMarker([b.location.lat, b.location.lng], {
            radius: 12,
            color: color,
            weight: 2,
            fillColor: color,
            fillOpacity: 0.55
          }).bindPopup(`
            <div style="padding:4px;">
              <b style="font-size:0.95rem; color:var(--text);">${b.name}</b><br/>
              <span style="color:${color}; font-weight:700; font-size:0.8rem;">Risk Score: ${b.risk_score}/100</span><br/>
              <div class="text-sm" style="color:var(--text-muted); margin-top:4px;">${b.recommended_action}</div>
            </div>
          `).addTo(map);
        });
      });
    }

    function searchTrajectory() {
      const p = document.getElementById('searchPlate').value.trim();
      if (!p) return;
      fetch('/api/trajectory/search?plate=' + encodeURIComponent(p))
        .then(r => r.json())
        .then(data => {
          if (!data.trajectory || !data.trajectory.features || !data.trajectory.features.length) {
            alert('No sighting trajectory found for ' + p);
            return;
          }
          if (trajectoryLayer) map.removeLayer(trajectoryLayer);
          const coords = data.trajectory.features.map(f => [f.geometry.coordinates[1], f.geometry.coordinates[0]]);
          trajectoryLayer = L.polyline(coords, {
            color: '#956E2F',
            weight: 5,
            opacity: 0.85,
            dashArray: '8, 8',
            lineCap: 'round'
          }).addTo(map);

          coords.forEach((coord, i) => {
            L.circleMarker(coord, {
              radius: 6,
              color: '#956E2F',
              fillColor: '#ffffff',
              fillOpacity: 1
            }).bindPopup(`<b>Waypoint #${i + 1}</b><br/>Plate: ${p}`).addTo(map);
          });

          map.fitBounds(trajectoryLayer.getBounds(), { padding: [50, 50] });
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadBlackspots();
    });
      let userMarker = null;

    function locateUser() {
      if (!navigator.geolocation) {
        alert("Geolocation is not supported by your browser.");
        return;
      }
      navigator.geolocation.getCurrentPosition((position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        map.flyTo([lat, lon], 14, { duration: 1.5 });
        if (userMarker) { map.removeLayer(userMarker); }
        userMarker = L.marker([lat, lon], {
          icon: L.divIcon({
            className: 'custom-user-icon',
            html: '<i class="ph ph-user" style="font-size:24px; color:var(--accent);"></i>',
            iconSize: [24, 24],
            iconAnchor: [12, 24]
          })
        }).addTo(map).bindPopup("<b>You are here</b>");
      }, () => {
        alert("Unable to retrieve your location. Please check your browser permissions.");
      });
    }

    async function searchMapLocation() {
      const q = document.getElementById("map-search-input").value;
      if (!q) return;
      try {
        const res = await fetch('https://nominatim.openstreetmap.org/search?format=json&q=' + encodeURIComponent(q));
        const data = await res.json();
        if (data && data.length > 0) {
          const lat = parseFloat(data[0].lat);
          const lon = parseFloat(data[0].lon);
          map.flyTo([lat, lon], 14, { duration: 1.5 });
          L.popup().setLatLng([lat, lon]).setContent('<b></b>').openOn(map);
        } else {
          alert("Location not found.");
        }
      } catch (err) {
        console.error("Search failed:", err);
      }
    }
</script>
</body>
</html>
