<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }} — Officer Command Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css" />
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      margin: 0;
    }
    .login-container {
      max-width: 440px;
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .login-header {
      padding: 32px 24px 22px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .role-tabs {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
      margin: 18px 0 8px;
      gap: 4px;
    }
    .role-btn {
      flex: 1;
      padding: 8px 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.25s var(--ease);
    }
    .role-btn:hover {
      color: var(--text);
    }
    .role-btn.active {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: var(--accent);
    }
    .login-body {
      padding: 28px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div style="margin-bottom:8px;"><i class="ph ph-buildings" style="font-size:2.4rem; color:var(--accent);"></i></div>
      <h2 style="font-size:1.38rem; color:var(--text); margin:0 0 4px; letter-spacing:-0.01em;">{{ app_name }}</h2>
      <div class="text-xs text-mono text-muted" style="letter-spacing:0.06em; text-transform:uppercase;">{{ organization }}</div>
      <div class="badge badge-yellow" style="margin-top:12px;">
        <span class="pulse-dot"></span> AUTHORIZED POLICE COMMAND ONLY
      </div>
    </div>

    <div class="login-body">
      {% if error %}
      <div style="background:var(--error-muted); border:1px solid var(--error); color:var(--error); padding:12px; border-radius:var(--radius-md); font-size:0.82rem; margin-bottom:16px; text-align:center;">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" id="login-form">
        <input type="hidden" name="role" id="selected-role" value="admin">

        <label class="text-sm text-muted" style="font-weight:700; text-transform:uppercase; letter-spacing:0.04em;">Select Police Designation:</label>
        <div class="role-tabs">
          <button type="button" class="role-btn active" onclick="setRole('admin', this)">Admin</button>
          <button type="button" class="role-btn" onclick="setRole('inspector', this)">Inspector</button>
          <button type="button" class="role-btn" onclick="setRole('superadmin', this)">Superadmin</button>
        </div>

        <label class="text-sm text-muted" style="font-weight:700; text-transform:uppercase; letter-spacing:0.04em; display:block; margin-top:14px; margin-bottom:6px;">Officer Password:</label>
        <input type="password" name="password" id="pw-input" placeholder="Enter password (e.g. pawan123)" required autofocus>

        <button type="submit" class="btn btn-primary w-full" style="padding:14px; font-size:0.92rem; font-weight:800; letter-spacing:0.03em;">
          ACCESS COMMAND CENTRE
        </button>
      </form>

      <!-- Quick Demo Access -->
      <div style="margin-top:20px; text-align:center;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px; color:var(--text-dim); font-size:0.72rem; font-family:var(--font-mono);">
          <hr style="flex:1; border:none; border-top:1px solid var(--border);">
          <span>QUICK EVALUATION</span>
          <hr style="flex:1; border:none; border-top:1px solid var(--border);">
        </div>

        <button class="btn btn-secondary w-full" style="padding:10px; font-size:0.82rem;" onclick="quickDemoLogin()">
          <i class="ph ph-lightning"></i> 1-Click Hackathon Demo Access
        </button>
      </div>

      <div style="margin-top:24px; text-align:center; display:flex; justify-content:center; gap:16px;">
        <a href="/citizen" class="text-sm text-muted">← Citizen Public Portal</a>
        <span style="color:var(--border);">·</span>
        <a href="/intelligence/login" class="text-sm" style="color:var(--accent);">Intelligence Command →</a>
      </div>
    </div>
  </div>

  <script>
    function setRole(roleName, btn) {
      document.getElementById('selected-role').value = roleName;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function quickDemoLogin() {
      document.getElementById('pw-input').value = '{{ demo_password }}' || 'demo123';
      document.getElementById('login-form').submit();
    }
  </script>
</body>
</html>
