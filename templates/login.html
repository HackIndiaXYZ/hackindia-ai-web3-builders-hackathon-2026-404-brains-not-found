<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }} — Officer Command Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      margin: 0;
      background: var(--bg-dark);
      font-family: var(--font-sans);
    }
    .login-container {
      max-width: 440px;
      width: 100%;
      background: rgba(13, 19, 33, 0.75);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      overflow: hidden;
      animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .login-header {
      padding: 32px 24px 22px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255, 153, 51, 0.12) 0%, transparent 100%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      position: relative;
    }
    .role-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 4px;
      margin: 18px 0 8px;
      gap: 4px;
    }
    .role-btn {
      flex: 1;
      padding: 8px 6px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .role-btn:hover {
      color: #fff;
    }
    .role-btn.active {
      background: rgba(255, 153, 51, 0.16);
      border-color: rgba(255, 153, 51, 0.4);
      color: var(--saffron);
      box-shadow: 0 2px 10px rgba(255, 153, 51, 0.15);
    }
    .login-body {
      padding: 28px;
    }
    .input-field {
      width: 100%;
      box-sizing: border-box;
      padding: 13px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(6, 9, 15, 0.6);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 16px;
      transition: all 0.25s ease;
    }
    .input-field:focus {
      border-color: var(--saffron);
      box-shadow: 0 0 16px rgba(255, 153, 51, 0.25);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="tricolor-stripe"></div>

    <div class="login-header">
      <div style="font-size:2.4rem; margin-bottom:8px; filter:drop-shadow(0 0 12px rgba(255,153,51,0.3));">🏛️</div>
      <h2 style="font-family:var(--font-heading); font-size:1.38rem; color:#fff; margin:0 0 4px; letter-spacing:-0.01em;">{{ app_name }}</h2>
      <div style="font-size:0.72rem; color:var(--text-muted); letter-spacing:0.06em; font-family:var(--font-mono); text-transform:uppercase;">{{ organization }}</div>
      <div class="badge badge-orange" style="margin-top:12px; font-size:0.68rem; font-weight:700;">
        <span class="pulse-dot" style="background:var(--saffron);"></span> AUTHORIZED POLICE COMMAND ONLY
      </div>
    </div>

    <div class="login-body">
      {% if error %}
      <div style="background:rgba(255,51,75,0.12); border:1px solid #ff334b; color:#ff6b6b; padding:12px; border-radius:10px; font-size:0.82rem; margin-bottom:16px; text-align:center;">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" id="login-form">
        <input type="hidden" name="role" id="selected-role" value="admin">

        <label style="font-size:0.75rem; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:0.04em;">Select Police Designation:</label>
        <div class="role-tabs">
          <button type="button" class="role-btn active" onclick="setRole('admin', this)">Admin</button>
          <button type="button" class="role-btn" onclick="setRole('inspector', this)">Inspector</button>
          <button type="button" class="role-btn" onclick="setRole('superadmin', this)">Superadmin</button>
        </div>

        <label style="font-size:0.75rem; color:var(--text-muted); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; display:block; margin-top:14px; margin-bottom:6px;">Officer Password:</label>
        <input type="password" name="password" id="pw-input" class="input-field" placeholder="Enter password (e.g. pawan123)" required autofocus>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; font-size:0.92rem; font-weight:800; letter-spacing:0.03em;">
          ACCESS COMMAND CENTRE
        </button>
      </form>

      <!-- Quick Demo Access -->
      <div style="margin-top:20px; text-align:center;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px; color:var(--text-dim); font-size:0.72rem; font-family:var(--font-mono);">
          <hr style="flex:1; border:none; border-top:1px solid rgba(255,255,255,0.08);">
          <span>QUICK EVALUATION</span>
          <hr style="flex:1; border:none; border-top:1px solid rgba(255,255,255,0.08);">
        </div>

        <button class="btn btn-outline" style="width:100%; padding:10px; font-size:0.82rem;" onclick="quickDemoLogin()">
          ⚡ 1-Click Hackathon Demo Access
        </button>
      </div>

      <div style="margin-top:24px; text-align:center; display:flex; justify-content:center; gap:16px;">
        <a href="/citizen" style="color:var(--text-muted); font-size:0.78rem; text-decoration:none; transition:color 0.2s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">← Citizen Public Portal</a>
        <span style="color:rgba(255,255,255,0.2);">·</span>
        <a href="/intelligence/login" style="color:var(--cyan); font-size:0.78rem; text-decoration:none;">Intelligence Command →</a>
      </div>
    </div>
  </div>

  <script>
    function setRole(roleName, btn) {
      document.getElementById('selected-role').value = roleName;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function quickDemoLogin() {
      document.getElementById('pw-input').value = '{{ demo_password }}' || 'demo123';
      document.getElementById('login-form').submit();
    }
  </script>
</body>
</html>
