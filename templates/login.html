<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }} — Officer Command Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-container {
      max-width: 420px;
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .login-header {
      padding: 28px 24px 20px;
      text-align: center;
      background: linear-gradient(180deg, rgba(255, 153, 51, 0.1), transparent);
      border-bottom: 1px solid var(--border);
    }
    .role-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 8px;
      padding: 4px;
      margin: 16px 0 6px;
      gap: 4px;
    }
    .role-btn {
      flex: 1;
      padding: 6px 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .role-btn.active {
      background: var(--surface-card);
      color: var(--saffron);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .login-body {
      padding: 24px;
    }
    .input-field {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.2s;
    }
    .input-field:focus {
      border-color: var(--saffron);
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="tricolor-stripe"></div>

    <div class="login-header">
      <div style="font-size:2.2rem; margin-bottom:4px;">🏛️</div>
      <h2 style="font-size:1.3rem; color:var(--text); margin-bottom:2px;">{{ app_name }}</h2>
      <div style="font-size:0.72rem; color:var(--text-muted); letter-spacing:0.04em;">{{ organization }}</div>
      <div class="badge badge-orange" style="margin-top:10px;">🔒 AUTHORIZED PERSONNEL ONLY</div>
    </div>

    <div class="login-body">
      {% if error %}
      <div style="background:rgba(230,28,22,0.15); border:1px solid #e61c16; color:#ff6b6b; padding:10px; border-radius:8px; font-size:0.8rem; margin-bottom:14px; text-align:center;">
        {{ error }}
      </div>
      {% endif %}

      <form method="POST" id="login-form">
        <input type="hidden" name="role" id="selected-role" value="admin">

        <label style="font-size:0.75rem; color:var(--text-muted); font-weight:600;">Select Police Designation:</label>
        <div class="role-tabs">
          <button type="button" class="role-btn active" onclick="setRole('admin', this)">Admin</button>
          <button type="button" class="role-btn" onclick="setRole('inspector', this)">Inspector</button>
          <button type="button" class="role-btn" onclick="setRole('superadmin', this)">Superadmin</button>
        </div>

        <label style="font-size:0.75rem; color:var(--text-muted); font-weight:600; display:block; margin-top:10px; margin-bottom:4px;">Officer Password:</label>
        <input type="password" name="password" id="pw-input" class="input-field" placeholder="Enter password (e.g. pawan123)" required autofocus>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; font-size:0.95rem; margin-top:4px;">
          ACCESS COMMAND CENTRE
        </button>
      </form>

      <!-- Quick Demo Access -->
      <div style="margin-top:16px; text-align:center;">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px; color:var(--text-dim); font-size:0.75rem;">
          <hr style="flex:1; border:none; border-top:1px solid var(--border);">
          <span>OR</span>
          <hr style="flex:1; border:none; border-top:1px solid var(--border);">
        </div>

        <button class="btn btn-outline" style="width:100%;" onclick="quickDemoLogin()">
          ▶ 1-Click Hackathon Demo Access
        </button>
      </div>

      <div style="margin-top:20px; text-align:center;">
        <a href="/citizen" style="color:var(--text-muted); font-size:0.8rem; text-decoration:none;">← Go to Citizen Public Portal</a>
      </div>
    </div>
  </div>

  <script>
    function setRole(roleName, btn) {
      document.getElementById('selected-role').value = roleName;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function quickDemoLogin() {
      document.getElementById('pw-input').value = '{{ demo_password }}' || 'demo123';
      document.getElementById('login-form').submit();
    }
  </script>
</body>
</html>
