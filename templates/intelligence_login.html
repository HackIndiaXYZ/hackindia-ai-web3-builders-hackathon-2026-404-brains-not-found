<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrafficGuard Intelligence — Operations Command Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
  <style>
    body {
      background: var(--bg-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .intel-login-box {
      width: 100%;
      max-width: 440px;
      background: rgba(13, 19, 33, 0.82);
      border: 1px solid rgba(0, 229, 255, 0.28);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 32px rgba(0, 229, 255, 0.12), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      position: relative;
      overflow: hidden;
      animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .intel-login-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00e5ff, #0077ff, #00e676);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
    }
    .intel-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .intel-logo {
      font-size: 2.5rem;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.5));
    }
    .intel-title {
      font-family: var(--font-heading);
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #fff;
    }
    .intel-title span {
      background: linear-gradient(135deg, #00e5ff 0%, #0099ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .intel-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-top: 4px;
      font-weight: 600;
      font-family: var(--font-mono);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }
    .form-input {
      width: 100%;
      box-sizing: border-box;
      background: rgba(6, 9, 15, 0.7);
      border: 1px solid rgba(0, 229, 255, 0.2);
      color: #fff;
      padding: 13px 16px;
      border-radius: 10px;
      font-family: var(--font-sans);
      font-size: 0.92rem;
      outline: none;
      transition: all 0.25s ease;
    }
    .form-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.35);
    }
    .btn-intel-submit {
      width: 100%;
      background: linear-gradient(135deg, #00e5ff 0%, #0077ff 100%);
      color: #06090f;
      font-weight: 800;
      border: none;
      padding: 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.92rem;
      letter-spacing: 0.03em;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 8px;
    }
    .btn-intel-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 229, 255, 0.45);
    }
    .btn-demo-quick {
      width: 100%;
      background: rgba(255, 153, 51, 0.1);
      border: 1px solid rgba(255, 153, 51, 0.35);
      color: var(--saffron);
      font-weight: 700;
      padding: 11px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.82rem;
      margin-top: 12px;
      transition: all 0.25s ease;
    }
    .btn-demo-quick:hover {
      background: rgba(255, 153, 51, 0.2);
      border-color: var(--saffron);
      transform: translateY(-1px);
    }
    .intel-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-dim);
    }
    .intel-footer a {
      color: var(--cyan);
      text-decoration: none;
      transition: color 0.2s;
    }
    .intel-footer a:hover {
      color: #fff;
    }
    .alert-error {
      background: rgba(255, 51, 75, 0.12);
      border: 1px solid #ff334b;
      color: #ff6b6b;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="intel-login-box">
    <div class="intel-header">
      <div class="intel-logo">🛡️</div>
      <div class="intel-title">TrafficGuard <span>Intelligence</span></div>
      <div class="intel-sub">AI Operations & Threat Grid Command</div>
      <div class="badge badge-cyan" style="margin-top:10px; font-size:0.68rem; font-weight:700;">
        <span class="pulse-dot"></span> SECURE OPERATOR ACCESS
      </div>
    </div>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/intelligence/login" id="intel-login-form">
      <div class="form-group">
        <label class="form-label">Operator Username</label>
        <input type="text" name="username" id="username-field" class="form-input" placeholder="e.g. intelligence" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Command Access Password</label>
        <input type="password" name="password" id="password-field" class="form-input" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn-intel-submit">Authorize & Enter Command Grid</button>
      <button type="button" class="btn-demo-quick" onclick="fillDemoCredentials()">⚡ Quick Demo Login (Operator)</button>
    </form>

    <div class="intel-footer">
      <div style="margin-bottom:8px; color:var(--text-muted);">Restricted to Authorized Police & Intelligence Units</div>
      <a href="/">← Standard Officer Command</a> · <a href="/citizen">Citizen Portal</a>
    </div>
  </div>

  <script>
    function fillDemoCredentials() {
      document.getElementById('username-field').value = 'intelligence';
      document.getElementById('password-field').value = 'trafficguard2026';
      document.getElementById('intel-login-form').submit();
    }
  </script>

</body>
</html>
