<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrafficGuard Intelligence — Operations Command Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css" />
  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 24px;
    }
    .intel-login-box {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      position: relative;
      overflow: hidden;
    }
    .intel-login-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--accent);
    }
    .intel-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-label {
      display: block;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }
    .alert-error {
      background: var(--error-muted);
      border: 1px solid var(--error);
      color: var(--error);
      padding: 12px 14px;
      border-radius: var(--radius-md);
      font-size: 0.82rem;
      margin-bottom: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="intel-login-box">
    <div class="intel-header">
      <div style="margin-bottom:8px;"><i class="ph ph-shield-check" style="font-size:2.5rem; color:var(--accent);"></i></div>
      <div style="font-size:1.45rem; font-weight:800; letter-spacing:-0.01em; color:var(--text);">TrafficGuard <span style="color:var(--accent);">Intelligence</span></div>
      <div class="text-xs text-mono text-muted" style="letter-spacing:0.06em; text-transform:uppercase; margin-top:4px; font-weight:600;">AI Operations & Threat Grid Command</div>
      <div class="badge badge-yellow" style="margin-top:10px;">
        <span class="pulse-dot"></span> SECURE OPERATOR ACCESS
      </div>
    </div>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/intelligence/login" id="intel-login-form">
      <div class="form-group">
        <label class="form-label">Operator Username</label>
        <input type="text" name="username" id="username-field" placeholder="e.g. intelligence" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">Command Access Password</label>
        <input type="password" name="password" id="password-field" placeholder="••••••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary w-full" style="padding:14px; font-size:0.92rem; font-weight:800; letter-spacing:0.03em; margin-top:8px;">Authorize & Enter Command Grid</button>
      <button type="button" class="btn btn-secondary w-full" style="padding:11px; font-size:0.82rem; margin-top:12px;" onclick="fillDemoCredentials()"><i class="ph ph-lightning"></i> Quick Demo Login (Operator)</button>
    </form>

    <div style="margin-top:24px; text-align:center; font-size:0.74rem; color:var(--text-dim);">
      <div style="margin-bottom:8px; color:var(--text-muted);">Restricted to Authorized Police & Intelligence Units</div>
      <a href="/" style="color:var(--accent);">← Standard Officer Command</a> · <a href="/citizen">Citizen Portal</a>
    </div>
  </div>

  <script>
    function fillDemoCredentials() {
      document.getElementById('username-field').value = 'intelligence';
      document.getElementById('password-field').value = 'trafficguard2026';
      document.getElementById('intel-login-form').submit();
    }
  </script>

</body>
</html>
