<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} — Admin Tools & Blacklist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
    <style>
        body {
            background: radial-gradient(circle at 50% 20%, rgba(0, 229, 255, 0.08) 0%, transparent 60%), var(--bg-dark);
            font-family: var(--font-sans);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(13, 19, 33, 0.8);
            border: 1px solid var(--glass-border);
            padding: 32px;
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
            max-width: 540px;
            width: 100%;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .admin-input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 16px;
            margin: 8px 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(6, 9, 15, 0.6);
            color: #fff;
            font-family: var(--font-sans);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.25s ease;
        }
        .admin-input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 16px rgba(0, 229, 255, 0.25);
        }
    </style>
</head>
<body>
<div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
            <div class="badge badge-cyan" style="font-size:0.68rem; margin-bottom:4px;">ADMINISTRATION</div>
            <h3 style="font-family:var(--font-heading); font-size:1.3rem; margin:0; color:#fff;">{{ app_name }} · Admin Control</h3>
        </div>
        <a href="/" class="btn btn-outline" style="padding:6px 12px; font-size:0.75rem;">← Command Center</a>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <a href="/map" class="btn btn-primary" style="flex:1; text-align:center; padding:10px;">🗺️ Open GIS Map</a>
        <a href="/intelligence" class="btn btn-outline" style="flex:1; text-align:center; padding:10px; border-color:var(--cyan); color:var(--cyan);">🛡️ Operations Grid</a>
    </div>

    <hr style="border:none; border-top:1px solid rgba(255,255,255,0.08); margin:20px 0;">

    <h4 style="font-family:var(--font-heading); font-size:1rem; margin:0 0 8px; color:#fff;">🚨 Vehicle Blacklist Management</h4>
    <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:14px;">Add vehicle registration plate to active intercept list across all AI vision camera nodes.</div>

    <label style="font-size:0.72rem; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Registration Number</label>
    <input type="text" id="blacklistPlate" class="admin-input" placeholder="Plate to blacklist (e.g. MH12AB1234)" style="font-family:var(--font-mono); text-transform:uppercase;" />
    
    <label style="font-size:0.72rem; color:var(--text-muted); font-weight:700; text-transform:uppercase;">Flagging Reason / FIR Ref</label>
    <input type="text" id="blacklistReason" class="admin-input" placeholder="Reason (e.g. Stolen Vehicle, FIR #204, Wanted Offender)" />
    
    <button onclick="addBlacklist()" class="btn btn-danger" style="width:100%; padding:12px; font-size:0.9rem; font-weight:800;">
        ⛔ Add to Law Enforcement Blacklist
    </button>
</div>

<script>
function addBlacklist() {
    const plate = document.getElementById('blacklistPlate').value.trim();
    const reason = document.getElementById('blacklistReason').value.trim();
    if (!plate || !reason) {
        alert('Please enter both plate and reason');
        return;
    }
    
    fetch('/admin/blacklist/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({plate_text: plate, reason: reason})
    })
    .then(r => r.json())
    .then(data => {
        alert('Added ' + data.plate_text + ' to blacklist');
        document.getElementById('blacklistPlate').value = '';
        document.getElementById('blacklistReason').value = '';
    })
    .catch(err => alert('Error adding to blacklist: ' + err));
}
</script>
</body>
</html>
