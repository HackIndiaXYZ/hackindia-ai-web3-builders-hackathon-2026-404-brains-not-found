<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} — Admin Tools & Blacklist</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='brand.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css" />
    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <style>
        body {
            font-family: var(--font-sans);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>
<div class="card" style="max-width:540px; width:100%; padding:32px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
            <div class="badge badge-blue" style="margin-bottom:4px;">ADMINISTRATION</div>
            <h3 style="font-size:1.3rem; margin:0; color:var(--text);">{{ app_name }} · Admin Control</h3>
        </div>
        <a href="/" class="btn btn-secondary btn-sm">← Command Center</a>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:20px;">
        <a href="/map" class="btn btn-primary" style="flex:1; text-align:center; padding:10px;"><i class="ph ph-map-trifold"></i> Open GIS Map</a>
        <a href="/intelligence" class="btn btn-secondary" style="flex:1; text-align:center; padding:10px;"><i class="ph ph-shield-check"></i> Operations Grid</a>
    </div>

    <hr>

    <h4 style="font-size:1rem; margin:0 0 8px; color:var(--text);"><i class="ph ph-warning-circle"></i> Vehicle Blacklist Management</h4>
    <div class="text-sm text-muted" style="margin-bottom:14px;">Add vehicle registration plate to active intercept list across all AI vision camera nodes.</div>

    <label class="text-xs text-muted" style="font-weight:700; text-transform:uppercase;">Registration Number</label>
    <input type="text" id="blacklistPlate" placeholder="Plate to blacklist (e.g. MH12AB1234)" style="font-family:var(--font-mono); text-transform:uppercase; margin:8px 0 16px;" />

    <label class="text-xs text-muted" style="font-weight:700; text-transform:uppercase;">Flagging Reason / FIR Ref</label>
    <input type="text" id="blacklistReason" placeholder="Reason (e.g. Stolen Vehicle, FIR #204, Wanted Offender)" style="margin:8px 0 16px;" />

    <button onclick="addBlacklist()" class="btn btn-danger w-full" style="padding:12px; font-size:0.9rem; font-weight:800;">
        <i class="ph ph-prohibit"></i> Add to Law Enforcement Blacklist
    </button>
</div>

<script>
function addBlacklist() {
    const plate = document.getElementById('blacklistPlate').value.trim();
    const reason = document.getElementById('blacklistReason').value.trim();
    if (!plate || !reason) {
        alert('Please enter both plate and reason');
        return;
    }

    fetch('/admin/blacklist/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({plate_text: plate, reason: reason})
    })
    .then(r => r.json())
    .then(data => {
        alert('Added ' + data.plate_text + ' to blacklist');
        document.getElementById('blacklistPlate').value = '';
        document.getElementById('blacklistReason').value = '';
    })
    .catch(err => alert('Error adding to blacklist: ' + err));
}
</script>
</body>
</html>
